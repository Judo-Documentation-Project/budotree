notes: 'José Manuel da Silva Araújo (born 1955 in Lisbon) is a Portuguese aikido practitioner who started training at age 10 in 1966 at Academia de Budo. He is considered one of the earliest Portuguese aikido practitioners still active. In his 2000 interview with Pedro Escudeiro, he stated that he began with aikido under Carlos Pereira (student of Georges Stobbaerts) and karate under Fragoso Fernandes (student of Luís Pires Martins). He later trained with Leopoldo Ferreira from 1973. He has been involved with União Portuguesa de Budo and is listed as a professor at Universidade da Beira Interior (UBI), though the UBU profile page returns a 404 error. According to the interview, he considers himself "o praticante português de Aikido mais antigo, actualmente em actividade" (the oldest Portuguese aikido practitioner currently active).

