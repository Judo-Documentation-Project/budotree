      sources:
        - uri: https://aikidomdc.wixsite.com/brpd/untitled-c1eb9
          cite: Aikido Marcial Dôjo Clube - Mestre José Araújo
          citation: >-
            Inicia a prática do Aikido e Karatedo em 1966, na Academia de Budo, com a idade de 10 anos, sendo seus
            professores Carlos Pereira, aluno de Mestre Georges Stobbaerts, e Fragoso Fernandes, aluno de Pires Martins,
            introdutor do Karatedo em Portugal.
        - uri: https://web.archive.org/web/20081021194517/http://www.cao.pt/surya/pe_18_1.htm
          cite: Entrevista ao Professor José Araújo (Pedro Escudeiro, 2000 - Archived)
          citation: >-
            O professor de Aikido era o Carlos Pereira, aluno do Mestre Stobbaerts, o de Karate era o Dr. Fragoso
            Fernandes, aluno do Dr. Pires Martins, (o introdutor do Karate em Portugal) que era o responsável pelo
            Karate. Professor de Filosofia, foi uma das pessoas que mais me marcou nas Artes Marciais, pela sua
            abordagem séria, rigorosa e profundamente empenhada.
      role: student
