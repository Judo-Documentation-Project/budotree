description:
  pt: António Hilmar Schalck Corrêa Pereira foi o fundador da Academia de Judo (1946), Academia de Budo (1958) e da União Portuguesa de Budo. Foi o primeiro português cinto negro inscrito no Kodokan e introduziu o judo marcial em Portugal após treinar jujutsu em Berlim na década de 1930.
