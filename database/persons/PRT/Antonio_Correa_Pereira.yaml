  cite: História do Judo em Portugal - Judolândia
  quotation: António Correia Pereira foi o editor da primeira revista sobre Judo Kodokan publicada em Portugal, da qual apenas saíram nove números. Sob o pseudónimo de Minero publicou o livro intitulado «A Essência do Judo». Foi o primeiro cinto negro português inscrito no Kodokan, porém por nunca ter estado ligado à Federação Portuguesa de Judo a sua graduação não é reconhecida por aquela entidade.
