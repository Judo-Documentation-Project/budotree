  quotation: A União Portuguesa de Budo, a mais antiga associação de Artes Marciais em Portugal, foi fundada pelo Mestre António Hilmar Schalck Corrêa Pereira. Iniciado na prática do Ju-Jutsu em Berlim, na década de trinta, quando estudava engenharia química na Universidade Técnica de Berlim. Funda então a Academia de Judo, cujo Dojo funcionará na Rua de S. Paulo até à abertura, em 1958, do Dojo de Entrecampos, que passa a chamar-se "Academia de Budo".
