description:
  en: Portuguese judoka (5th dan), student of Bastos Nunes since 1980, jurist and master of judo adapted for the blind.
  pt: Judoca português (5º dan), aluno de Bastos Nunes desde 1980, jurista e mestre de judo adaptado para cegos.
notes: Fernando Seabra started practicing judo in 1980 at Judo Clube de Sintra - Judokai in Cacém with Mestre Bastos Nunes. He has been a student of Bastos Nunes for over 30 years. Professionally, he is a jurist (lawyer) and specializes as a master of judo adapted for the blind and visually impaired. According to Judokai.pt, he was previously a 4th dan and responsible for technical preparation classes for graduation exams. He was promoted to 5th dan on January 13, 2017, as documented in official FPJ exam results.
