    rationale: Student of Jackie Hugnet from 1955-1965, co-founder with him of Círculo de Judo do Porto and co-instructor for Porto Police, documented in FPJ graduation manual and club history
  role: student
  interactions:
  - place_id: JDP-P-22
    period:
      start: 1955
      end: 1965
    sources:
    - source_id: JDP-SRC-5
      cite: Manual de Graduações e Regulamento de Graduações. Federação Portuguesa de Judo (Dezembro 2020)
      quotation: Em 1955, os judocas do Porto organizados em torno do professor Jackie Hugnet, criam o Círculo de Judo do Porto, onde Hugnet foi professor durante sete anos, lecionando três vezes por semana a primeira classe em que o Judo Kodokan foi ministrado de forma sistemática no Porto. Os professores Hugnet e Manuel Reis foram instrutores de Judo da Polícia de Segurança Pública do Porto, durante cerca de dois anos meio, coincidentes com parte do período em que o Comandante da corporação era o famoso Chefe Santos Júnior.
      type: primary
      supports: true
      weight: high
    - source_id: JDP-SRC-6
      cite: Os nossos fundadores - Clube de Judo do Porto (Archived)
      quotation: Este, impressionado com a determinação de Manuel Reis mas sem disponibilidade para ficar em Portugal, enviou para o Círculo de Judo do Porto o seu irmão Jackie Hugnet, 2º Dan de Judo, que connosco permaneceu por uma década
      type: tertiary
      supports: true
      weight: low
