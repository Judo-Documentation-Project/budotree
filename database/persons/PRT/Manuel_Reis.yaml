description:
  pt: Fundador do Clube de Judo do Porto e figura central do desenvolvimento do judo no norte de Portugal
notes: Organizador e promotor do judo no Porto desde os anos 1950, responsável por trazer mestres internacionais como Nobuyoshi Yamamoto, Jackie Hugnet e Gilbert Briskine para Portugal
