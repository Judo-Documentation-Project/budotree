description:
  en: Portuguese judoka, Olympic bronze medalist at Sydney 2000, European champion, and prominent judo coach and commentator
notes: Nuno Delgado is one of Portugal's most successful judokas, winning bronze at the 2000 Sydney Olympics in the -81 kg category. He also won gold at the 1999 European Judo Championships and silver at the 2000 European Championships. After retiring from competition, he became a respected coach, commentator, and promoter of judo in Portugal. He founded the Nuno Delgado Academy and has been involved in various television programs promoting sports and healthy lifestyles.
