notes: 'Real name: Omori Kojiro (大森 幸次郎). Family register in Chiba Prefecture, Japan. Started judo at age 13, earned 1st dan at 17. Moved to USA in 1910, then to Brazil in 1925. Opened first jujitsu school in São Paulo''s Edificio Martinelli in 1931. Considered instrumental in teaching Carlos Gracie and establishing Brazilian Jiu-Jitsu. Fought 503 matches in career including fights against capoeira practitioners and members of the Gracie family. Died from food poisoning in 1938.'
