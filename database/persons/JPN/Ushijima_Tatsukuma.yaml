description:
  en: Tatsukuma Ushijima (牛島辰熊, March 10, 1904 – May 26, 1985) was a Japanese judoka and former All-Japan judo champion, who was also known as a teacher of Masahiko Kimura, a famous judoka. His nickname was 'The Demon Ushijima'.
  ja: 牛島 辰熊（うしじま たつくま、1904年（明治37年）3月10日 - 1985年（昭和60年）5月26日）は、日本の柔道家。段位は講道館柔道九段。大日本武徳会柔道教士。明治神宮大会3連覇、昭和天覧試合準優勝。その圧倒的な強さと気の荒さから「鬼の牛島」と称された。柔道史上最強を謳われる木村政彦の師匠として有名。
