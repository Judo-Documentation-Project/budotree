description:
  en: Nobuaki Yamamoto (born ~1942) was a Japanese judo master who taught at Clube de Judo do Porto in Portugal from 1968 to 1969. A 5th dan Kodokan student and former university champion in Japan, he was brought to Portugal under the Fundo de Fomento Desportivo program to teach judo.
