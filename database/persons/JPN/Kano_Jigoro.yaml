      quotation: Kanō began studying with Iso, who had been a friend of Fukuda. Despite being 62 years old and standing only 5 feet (1.52 m) tall, Iso had gained a powerful build from jūjutsu training. He was known for excellence in kata, and was also a specialist in atemi, or the striking of vital areas. In Iso's method, one began with kata and then progressed to free fighting (randori). Due to Kanō's intense practice and his solid grounding in the jūjutsu taught by Fukuda, Kanō became an assistant instructor at Iso's school.
