      quotation: Kanō began training in Kitō-ryū with Iikubo Tsunetoshi (Kōnen). Iikubo was an expert in kata and throwing, and fond of randori. Kanō applied himself thoroughly to learning Kitō-ryū, believing Iikubo's throwing techniques in particular to be better than in the schools he had previously studied. Iikubo issued Kanō a formal jūjutsu rank and teaching credential, namely a certificate of menkyo in Kitō-ryū, dated October 1883.
