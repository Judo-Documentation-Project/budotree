description:
  en: Takeo Yano (1909–1988), also known as Takeo Iano, was a Japanese judoka who helped in the establishment of Brazilian jiu-jitsu in Brazil. Known as "The Eastern Demon", he fought members of the Gracie family and is thought to have introduced the heel hook to Brazilian jiu-jitsu.
  pt: Takeo Yano (1909 – Belo Horizonte, 1988) foi um judoca japonês que contribuiu para o estabelecimento do jiu-jitsu no Brasil. Conhecido como "Demônio Oriental", lutou contra membros da família Gracie e acredita-se que tenha introduzido a chave de calcanhar no jiu-jitsu brasileiro.
