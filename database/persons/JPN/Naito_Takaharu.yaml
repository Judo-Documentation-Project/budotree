description:
  en: A swordsman of the Hokushin Ittō-ryū, Naitō taught kendo to the Japanese Police force, and was also the first teacher at the Budo Senmon Gakko. He helped to create the Dai Nihon Teikoku Kendo Kata, a group that promulgated the practice of kendo in Japanese schools and universities under the auspices of the Dai Nippon Butoku Kai.
notes: |
  Originally named Ichige Takaharu (市毛高治), adopted by relative Naitō Gizaemon Masatoshi and took the name Naitō Takaharu.
  Studied Hokushin Ittō-ryū at Mito Tobukan under Kozawa Torakichi (student of Chiba Shusaku).
  Studied Jikishinkage-ryu under Sakakibara Kenkichi in Tokyo (1883).
  Went on musha-shugyo (warrior pilgrimage) around Japan.
  Defeated Takano Sasaburo and Kawasaki Zenzaburo in matches.
  Joined Keishicho (Tokyo Metropolitan Police) in 1888 as a police officer.
  Awarded Seirensho in 1897 by Dai Nippon Butoku Kai.
  One of five kendo teachers at Butokuden in Kyoto from 1899.
  Head instructor at Budo Senmon Gakko, taught all five future 10th dan holders.
  Opposed sportification of kendo, emphasized basics (kirikaeshi and kakarigeiko).
  Died of cerebral hemorrhage in 1929, opposed to holding Tenran shiai (imperial tournament).
