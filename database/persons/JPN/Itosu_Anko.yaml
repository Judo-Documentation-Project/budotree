notes: 'Considered "father of modern karate" (along with Gichin Funakoshi). Created the Pinan/Heian forms for schoolchildren. Wrote "Ten Precepts (Tode Jukun) of Karate" in 1908. Served as secretary to the last king of the Ryūkyū Kingdom. Teacher of many prominent karate masters including Gichin Funakoshi, Kenwa Mabuni, and Chōshin Chibana.

