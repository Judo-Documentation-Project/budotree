description:
  en: Soshihiro Satake (佐竹信四郎), also known as Antônio Satake, was a Japanese-born Brazilian martial artist and teacher. One of the primary founders of Brazilian jiu-jitsu (BJJ), he pioneered judo in Brazil, the United Kingdom, and other countries. He was a member of the Ten'gu Club sports social group.
