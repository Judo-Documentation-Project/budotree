description:
  en: Japanese martial artist who founded Yoseikan dojo. Direct student of judo founder Jigoro Kano, aikido founder Morihei Ueshiba, and karate founder Gichin Funakoshi. First to teach aikido in the West (France 1951-1953). Holder of high dan ranks in multiple martial arts including 10th dan in Aikido, 9th dan in Jujutsu, and 8th dan in Judo.
