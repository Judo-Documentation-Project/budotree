    quotation: Minoru Mochizuki (望月 稔, Mochizuki Minoru; April 7, 1907 – May 30, 2003) was a Japanese martial artist who founded the dojo Yoseikan. He was a 10th dan in Aikido, 9th dan in Jujutsu, 8th dan in Iaido, 8th dan in Judo, 8th dan in Kobudo, 5th dan in Kendo, 5th dan in Karate, and a 5th dan in Jojutsu.
