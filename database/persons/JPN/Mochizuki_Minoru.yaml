notes: '- Sent by Jigoro Kano to study aikijujutsu with Morihei Ueshiba in 1930

  - Received Daito-ryu scrolls from Ueshiba in 1932 including menkyo kaiden (master teacher''s license)

  - Founded Yoseikan dojo in Shizuoka City in 1931

  - First to teach aikido in the West when he traveled to France as a judo teacher from 1951 to 1953

  - Son is Hiroo Mochizuki, founder of Yoseikan Budo

  - Member of Kodokan''s Kobudo Kenkyukai (Association for Classical Martial Arts Research)

  - Studied multiple arts including Gyokushin-ryu jujutsu, Katori Shinto-ryu, kendo, and jojutsu

  - Spent eight years in Mongolia working on irrigation and communication projects

  '
