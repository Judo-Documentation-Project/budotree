name:
  ja-Latn: Ueshiba Morihei
  ja: 植芝 盛平
description:
  en: Morihei Ueshiba (植芝 盛平, Ueshiba Morihei; December 14, 1883 – April 26, 1969) was a Japanese martial artist and founder of the martial art of aikido. He is often referred to as 'the founder' Kaiso (開祖) or Ōsensei (大先生/翁先生), 'Great Teacher'.
  ja: 植芝 盛平（うえしば もりへい、1883年〈明治16年〉12月14日 - 1969年〈昭和44年〉4月26日）は、日本の武道家。合気道の創始者。合気道界では「開祖」（かいそ）と敬称される。
