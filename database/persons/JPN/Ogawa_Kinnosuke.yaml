description:
  en: Ogawa Kinnosuke was born in 1884 in Aichi prefecture. He began kendo whilst in school, at around 13/15 years of age, under kendo hanshi Kato Kiichi and later under Kohori Yasutada. He was a student and later an instructor at the Budo Senmon Gakko, as well as in the Nagoya police. He was a Butokukai hanshi and was Busen's principle kendo instructor in the 1930's and up until 1945.  He authored "Teikoku Kendo Kyohon" (The Kendo Textbook of Imperial Japan) in 1932 (revised 1937) and was posthumously inducted into the Kendo Hall of Fame in 2003.
notes: One of the most influential kendo instructors of the 20th century, considered part of the triumvirate with Naito Takaharu and Takano Sasaburo that shaped modern kendo. Founded Kodokan dojo in 1924. Participated in Tenran shiai (imperial tournaments) in 1934 and 1940. Was the first kendoka to receive the Medal with Purple Ribbon in 1959.
