notes: Shiina Ichizo was a shihan (teaching master) of Tenshin Shōden Katori Shintō-ryū. He was one of the seven direct students of Iizasa Morisada, the 18th Soke of Katori Shinto-ryu. In the late 1920s, he was one of four Katori Shinto-ryu shihan (along with Narimichi Tamai, Sozaemon Kuboki, and Tanekichi Ito) dispatched to teach the style at the Kodokan in Tokyo at the request of Jigoro Kano. The four shihan would also stop in Kawasaki on their way home to train with Yoshio Sugino. Shiina demonstrated Katori Shinto-ryu with Yoshio Sugino at a budo demonstration sponsored by the Society for the Promotion of Classical Japanese Martial Arts held in the imperial palace around 1937-1938.
