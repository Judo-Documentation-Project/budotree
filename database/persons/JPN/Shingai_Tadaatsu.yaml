description:
  en: Shingai Tadaatsu (真貝忠篤) was a Japanese swordsman and kendo master from the Meiji period. He was a samurai of Ōgaki Domain, a kendo instructor for the Imperial Police, and was awarded the rank of hanshi by the Dai Nippon Butoku Kai in 1908.
