description:
  en: Yokoyama Sakujirō was one of the earliest disciples of Kanō Jigorō and one of the Kodokan Shitennō (Four Guardians of the Kodokan). He was known as "Demon Yokoyama" for his violent fighting style and harsh training methods.
  ja: 横山 作次郎は、嘉納治五郎の最初期の弟子の一人で、講道館四天王の一人。その荒々しい戦い方と厳しい稽古方法から「鬼横山」と呼ばれた。
