notes: Arrived in Brazil in 1936 with wife and son Matsuo. Founded Hombu Dojô Budokan in São Paulo's Liberdade district in 1938. His son Matsuo Ogawa took over the academy in the early 1960s. Grandsons Hitoshi and Hatiro Ogawa (both 6 dan) continue the family tradition. The Budokan tournament is considered the oldest judo tournament outside Japan, with over 70 editions. He was also a member of Dai Nihon Butokukai and Shihan of Kashima Shin'yo Ryu Jujutsu Judo.
