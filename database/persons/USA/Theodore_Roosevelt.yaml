description:
  en: 26th President of the United States and judo practitioner
notes: Theodore Roosevelt was the first American president to practice judo, training under Yoshiaki Yamashita in the White House during March-April 1904. He was posthumously awarded an honorary 8th dan by the United States Judo Association in 2007 for his role in introducing judo to America. As president, he was known for his "Square Deal" domestic policies, conservation efforts, and winning the Nobel Peace Prize for mediating the Russo-Japanese War.
