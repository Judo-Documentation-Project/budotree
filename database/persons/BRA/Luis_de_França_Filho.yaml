        - uri: https://www.bjjheroes.com/bjj-fighters/luiz-franca
          cite: 'BJJ Heroes: Luiz França'
          citation: >-
            There Satake settled for a while, opening his own academy in 1916, at the Atlético Clube Rio Negro, becoming
            the first Japanese to open a Judo/Jiu Jitsu academy in Brazil. This gym became the place where Luiz França
            started his life as a martial artist. Satake would also become a Brazilian citizen years later, and change
            his name to Antônio Soshihiro Satake.
        - uri: https://www.facebook.com/photo.php?fbid=543032192445535&id=455479647867457&set=a.455593414522747
          cite: Equipe Fadda Jiu-Jitsu (Facebook)
          citation: >-
            Antigo aluno de Soishiro Satake e Mitsuyo Maeda, Luiz França foi o fundador da linhagem (não pertencente à
            família Gracie) de mais sucesso no Jiu-Jitsu, uma linhagem continuada especialmente através do trabalho
            efetuado pelo mais proeminente e capaz aluno de França, o Mestre Oswaldo Fadda, que mais tarde formaria a
            sua própria escola de talentosos alunos.
      role: student
