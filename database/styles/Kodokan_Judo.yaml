  description:
    en: |
      Kodokan Judo is a modern martial art created by Jigoro Kano in 1882. It is a refinement and codification of jujutsu principles with an emphasis on throwing techniques, groundwork, and moral education. Judo became the first Japanese martial art to gain widespread international recognition and was inducted as an Olympic sport in 1964.
