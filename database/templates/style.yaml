# yaml-language-server: $schema=../schemas/style.schema.json
#
# Judo Documentation Project: Judo Lineage Tree Sub-project
# Style template - v2 format
#
# Required fields:
#   name
#   founded (with date)
#   sources (array)
---

style:
  id:                         # Assigned during import - leave empty
  name:                       # Display name (REQUIRED)
  native_name:                # Optional native script name
    name:
    lang:                     # ISO 639-1 code
  aka:                        # Alternative names (optional)
    - name: "Alternative Name"
  type: gendai                # NEW in v2: koryu | gendai | hybrid | sport | other
  related_styles:             # NEW in v2: replaces parent_style_id
    - style_id: JDP-S-1       # Target style ID (nullable)
      type: derived_from      # derived_from | split_from | influenced_by | sibling_style_of
      quality: 2              # 0=Disputed, 1=Uncertain, 2=Probable, 3=Confirmed
      notes: ""               # What was transmitted (optional)
      sources:                # Sources for this specific relationship (optional)
        - source_id: JDP-SRC-1
  founded:                    # REQUIRED (renamed from 'birth' in v1)
    date:                     # BudoDate: null | year (int) | "YYYY-MM-DD" | "~YYYY"
    place_id: JDP-P-1         # Place/venue ID where founded (nullable)
    geo:                      # Geographic reference (nullable)
      location:               # Geographic display name (e.g., "Tokyo")
      location_qid: Q1490     # Wikidata Q-ID for location (optional)
      country_code: JPN       # ISO 3166-1 alpha-3
      country_qid: Q17        # Wikidata Q-ID for country (optional)
    founder_id: JDP-1         # Person ID of founder (nullable)
    sources:
      - source_id: JDP-SRC-1
  dissolved: null             # Renamed from 'death'; null if still active
    # date: 1950              # BudoDate
    # sources:
    #   - source_id: JDP-SRC-2
  rank_system:                # NEW in v2: describes ranking system (optional)
    type: dan-kyu             # dan-kyu | menkyo | military | other
    description:
      en: "Standard dan/kyu grading system"
  description:                # Multilingual map (optional)
    en: >
      Brief description of the style...
    # ja: >
    #   スタイルの説明...
  media:                      # Photos and videos (optional)
    photos:
      - url: "https://..."
        source:
          source_id: JDP-SRC-3
    videos:
      - url: "https://..."
        source:
          source_id: JDP-SRC-4
  sources:                    # REQUIRED, at least one
    - source_id: JDP-SRC-1
      events: [name, founded]
    # - uri: "https://..."    # Fallback if no source entity
    #   cite: "Source name"
  links:                      # External identifiers (optional)
    - uri: "https://www.wikidata.org/wiki/Q5616"
      type: wikidata
  tags:                       # Optional tags
    - grappling
    - throwing
